name: 🐛 Bug Report
description: Report a problem with Cerebro
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it.

        > 🔒 **Found a security issue?** Please do NOT report it here. See [SECURITY.md](https://github.com/Professor-Low/Cerebro-Installer/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Cerebro Version
      description: Find this under Settings → About
      placeholder: e.g. v6.0.0-alpha.1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Ubuntu / Debian
        - Other Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Cerebro
        2. Go to ...
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        From your data directory's `logs/` folder. Paste the last ~50 lines of `backend.log` and/or `main.log` if relevant.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this isn't a duplicate
          required: true
        - label: I am running the latest released version (or have noted otherwise above)
          required: true
